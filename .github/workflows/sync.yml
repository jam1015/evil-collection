name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_mirror:
    runs-on: ubuntu-latest
    name: Mirror sync ← upstream/master (fast-forward)
    steps:
      - name: Checkout sync
        uses: actions/checkout@v4
        with:
          ref: sync

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_sync_branch: sync
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: emacs-evil/evil-collection
          upstream_sync_branch: master

  rebuild_sync_dev:
    runs-on: ubuntu-latest
    needs: sync_mirror
    name: Rebuild sync_dev from upstream/master + dev patches
    steps:
      - name: Checkout sync_dev
        uses: actions/checkout@v4
        with:
          ref: sync_dev
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch dev and upstream
        run: |
          git fetch origin dev:dev
          git remote add upstream https://github.com/emacs-evil/evil-collection.git
          git fetch upstream master

      - name: Reset sync_dev to upstream/master
        run: git reset --hard upstream/master

      - name: Cherry-pick dev patches onto upstream/master
        run: git cherry-pick --empty=drop upstream/master..dev

      - name: Force-push sync_dev
        run: git push --force-with-lease origin sync_dev
